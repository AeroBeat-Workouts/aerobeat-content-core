schemaId: aerobeat.song-package.v1
schemaVersion: 1
recordVersion: 1
songPackageId: ab-songpkg-splat-demo
songPackageName: Splat Demo Song Package
description: >-
  Canonical song.package.yaml fixture covering preview audio metadata on the
  embedded root song record.
packageVersion: 1.0.0
song:
  schemaId: aerobeat.song.v1
  schemaVersion: 1
  recordVersion: 1
  songId: ab-song-splat-demo
  songName: Splat Demo Song
  audio:
    filePath: media/audio/splat-demo.ogg
    previewFilePath: media/audio/splat-demo-preview.ogg
    previewUrl: https://cdn.example.invalid/beatsaver/splat-demo-preview.mp3
    previewStartTime: 12.5
    previewDuration: 3.25
    previewMode: preview_file
    durationMs: 90000
  timing:
    anchorMs: 0
    tempoSegments:
      - startBeat: 0
        bpm: 128
    stopSegments: []
    timeSignatureSegments:
      - startBeat: 0
        numerator: 4
        denominator: 4
charts:
  - setId: ab-set-splat-demo-boxing-normal
    setName: Splat Demo Boxing Normal
    chartId: ab-chart-splat-demo-boxing-normal
    path: charts/ab-chart-splat-demo-boxing-normal.yaml
  - setId: ab-set-splat-demo-boxing-hard
    setName: Splat Demo Boxing Hard
    chartId: ab-chart-splat-demo-boxing-hard
    path: charts/ab-chart-splat-demo-boxing-hard.yaml
